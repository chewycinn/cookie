<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations, My Love!</title>
    <style>
        body {
            background-color: #f3e5f5; /* Light purple background */
            font-family: 'Arial', sans-serif;
            color: #6a1b9a; /* Dark purple text */
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin: 20px 0;
            color: #d5006d; /* Pink color */
        }
        .start-button {
            background-color: #d5006d; /* Pink button */
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .start-button:hover {
            background-color: #c51162; /* Darker pink on hover */
        }
        .message {
            display: none; /* Hidden by default */
            background-color: #e1bee7; /* Light purple box */
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .heart {
            color: #d5006d; /* Pink heart */
            font-size: 2em;
        }
        footer {
            margin-top: 50px;
            font-size: 1em;
            color: #9e9e9e;
        }
    </style>
</head>
<body>

    <h1>Congratulations, My Love!</h1>
    <button class="start-button" onclick="showMessage()">Press Here to Start</button>

    <div class="message" id="message">
        <p>I'm so proud of you for all that you've accomplished!</p>
        <p>Your hard work and dedication inspire me every day.</p>
        <p>Keep shining bright! 🌟</p>
        <p class="heart">❤️</p>
        <p>Your personal message goes here!</p>
    </div>

    <footer>
        <p>With all my love,</p>
        <p>Your Name</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById('message').style.display = 'block';
        }
    </script>

</body>
</html>
